name: Update device prices

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  update-prices:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        run: yarn

      - name: Fetch latest prices
        run: yarn update-prices

      - name: Verify the project still builds
        run: yarn build

      - name: Create pull request if prices changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: update device prices'
          title: 'chore: update device prices'
          body: |
            Automated weekly price refresh from the official product pages.

            This PR was opened automatically because at least one device's price changed. Please double check the numbers before merging, especially if any of them look unusually large or small.
          branch: automated/update-prices
          delete-branch: true
